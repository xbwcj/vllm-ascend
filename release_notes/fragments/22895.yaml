pr: 22895
entries:
  - category: feature
    text: >-
      Added static EPLB initialization via `eplb_config.mode="static"` and
      `eplb_config.expert_placement_path` under `--additional-config`: a
      `version: 1` expert placement snapshot JSON is installed once before
      memory profiling and graph capture, keeping expert-replica routing active
      without runtime load recording, placement planning, or weight migration.
      Pipeline parallelism and registered MoE speculative drafts with EPLB
      enabled are supported (requires `--enable-eplb`).
