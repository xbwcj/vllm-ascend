pr: 22895
entries:
  - category: feature
    text: >-
      Added static EPLB through `eplb_config.mode=static`: the
      deployment exported by a dynamic run is installed once, before memory
      profiling and graph capture, and the engine keeps expert-replica routing
      without runtime load recording, placement planning or weight migration.
      A registered MoE draft follows the target, so dynamic mode rebalances the
      target and draft together and static mode installs one placement for both.
      Initial support requires PP=1.
